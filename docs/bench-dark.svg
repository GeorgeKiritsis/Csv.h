<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Throughput of csv.h versus libcsv across three workloads">
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;}</style>
<rect width="760" height="300" rx="8" fill="#1a1a19"/>
<text x="28" y="36" font-size="16" font-weight="600" fill="#ffffff">Throughput vs libcsv 3.0.3</text>
<text x="28" y="56" font-size="12" fill="#8f8e86">64 MB document, gcc 13 -O2, one core of a 2.8 GHz Xeon</text>
<text x="692" y="36" font-size="12" fill="#c3c2b7">libcsv</text>
<rect x="674" y="26" width="10" height="10" rx="2" fill="#d95926"/>
<text x="625" y="36" font-size="12" fill="#c3c2b7">csv.h</text>
<rect x="607" y="26" width="10" height="10" rx="2" fill="#3987e5"/>
<path d="M176 78h284.2a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H176z" fill="#3987e5"/>
<text x="474.2" y="92" font-size="12" fill="#c3c2b7">415 MB/s</text>
<path d="M176 102h106.4a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H176z" fill="#d95926"/>
<text x="296.4" y="116" font-size="12" fill="#c3c2b7">159 MB/s</text>
<text x="160" y="92" font-size="12.5" text-anchor="end" fill="#c3c2b7">short fields  ~6 B</text>
<text x="160" y="116" font-size="11.5" text-anchor="end" fill="#8f8e86">2.6× slower</text>
<path d="M176 146h267.5a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H176z" fill="#3987e5"/>
<text x="457.5" y="160" font-size="12" fill="#c3c2b7">391 MB/s</text>
<path d="M176 170h126.5a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H176z" fill="#d95926"/>
<text x="316.5" y="184" font-size="12" fill="#c3c2b7">188 MB/s</text>
<text x="160" y="160" font-size="12.5" text-anchor="end" fill="#c3c2b7">quoted + escapes</text>
<text x="160" y="184" font-size="11.5" text-anchor="end" fill="#8f8e86">2.1× slower</text>
<path d="M176 214h456.4a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H176z" fill="#3987e5"/>
<text x="646.4" y="228" font-size="12" fill="#c3c2b7">663 MB/s</text>
<path d="M176 238h102.9a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H176z" fill="#d95926"/>
<text x="292.9" y="252" font-size="12" fill="#c3c2b7">154 MB/s</text>
<text x="160" y="228" font-size="12.5" text-anchor="end" fill="#c3c2b7">long fields ~220 B</text>
<text x="160" y="252" font-size="11.5" text-anchor="end" fill="#8f8e86">4.3× slower</text>
<line x1="176" y1="70" x2="176" y2="262" stroke="#33332f" stroke-width="1"/>
<text x="28" y="284" font-size="11" fill="#8f8e86">Higher is better. Both parsers walk every field byte; field counts and checksums match exactly.</text>
</svg>
