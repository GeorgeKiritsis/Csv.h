name: ci

on: [push, pull_request]

jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: check
        env:
          CC: ${{ matrix.cc }}
        run: make check
      - name: fuzz (short)
        # Apple clang has no libFuzzer (-fsanitize=fuzzer), so ubuntu only.
        if: matrix.cc == 'clang' && matrix.os == 'ubuntu-latest'
        run: make fuzz-run SECONDS_=120

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      # One command per step: cmd does not stop at the first failing line, so a
      # combined step reports only the last command's exit code and hides which
      # command actually failed.
      - name: build test_csv (MSVC /W4 /WX)
        shell: cmd
        run: cl /nologo /W4 /WX /D_CRT_SECURE_NO_WARNINGS /Fe:test_csv.exe tests\test_csv.c
      - name: run test_csv
        shell: cmd
        run: test_csv.exe
      - name: build test_spectrum (MSVC /W4 /WX)
        shell: cmd
        run: cl /nologo /W4 /WX /D_CRT_SECURE_NO_WARNINGS /Fe:test_spectrum.exe tests\test_spectrum.c
      - name: run test_spectrum
        shell: cmd
        run: test_spectrum.exe
      - name: single-TU configuration
        shell: cmd
        run: cl /nologo /W4 /WX /D_CRT_SECURE_NO_WARNINGS /DCSV_STATIC /c tests\core_only.c
      - name: C++ configuration
        shell: cmd
        run: cl /nologo /W4 /WX /D_CRT_SECURE_NO_WARNINGS /TP /c tests\core_only.c
      - name: freestanding core configuration
        shell: cmd
        run: cl /nologo /W4 /WX /D_CRT_SECURE_NO_WARNINGS /DCSV_NO_ALLOC /DCSV_NO_STDIO /c tests\core_only.c
